name: Run Program

on:
  workflow_dispatch:
  push:
    paths:
      - src/program/**
      - pyproject.toml
  pull_request:
    paths:
      - src/program/**
      - pyproject.toml

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Build and Install Program
        run: |
          uv pip install -e .

      - name: Run Program
        run: |
          uv run src/program/main.py

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: logs/
          archive: true
          retention-days: 90
          if-no-files-found: ignore
